<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Database for PUR overview banner</title>
  <desc id="desc">A visual summary connecting polyurethane chemistry, structured evidence, database infrastructure and inverse design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10294a"/>
      <stop offset="1" stop-color="#123f57"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="38" r="150" fill="#38bdf8" opacity="0.07"/>
  <circle cx="90" cy="335" r="190" fill="#8b5cf6" opacity="0.07"/>

  <!-- molecular motif -->
  <g opacity="0.7" stroke="#67e8f9" stroke-width="3" fill="#0f2943">
    <line x1="75" y1="95" x2="125" y2="65"/>
    <line x1="125" y1="65" x2="175" y2="95"/>
    <line x1="175" y1="95" x2="175" y2="150"/>
    <line x1="175" y1="150" x2="125" y2="180"/>
    <line x1="125" y1="180" x2="75" y2="150"/>
    <line x1="75" y1="150" x2="75" y2="95"/>
    <circle cx="75" cy="95" r="8"/><circle cx="125" cy="65" r="8"/><circle cx="175" cy="95" r="8"/>
    <circle cx="175" cy="150" r="8"/><circle cx="125" cy="180" r="8"/><circle cx="75" cy="150" r="8"/>
    <line x1="175" y1="122" x2="230" y2="122" stroke-dasharray="7 7"/>
    <circle cx="245" cy="122" r="12" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- database icon -->
  <g transform="translate(880 116)" filter="url(#shadow)">
    <ellipse cx="84" cy="22" rx="76" ry="22" fill="#dbeafe"/>
    <rect x="8" y="22" width="152" height="96" fill="#bfdbfe"/>
    <ellipse cx="84" cy="70" rx="76" ry="22" fill="#93c5fd"/>
    <ellipse cx="84" cy="118" rx="76" ry="22" fill="#60a5fa"/>
    <ellipse cx="84" cy="22" rx="76" ry="22" fill="none" stroke="#eff6ff" stroke-width="2"/>
  </g>

  <!-- title block -->
  <text x="285" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#f8fafc">Database for PUR</text>
  <text x="285" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a5f3fc">Evidence-grounded polyurethane research infrastructure</text>
  <text x="285" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">Formulation → Process → Rheology → Adhesion → Evidence → Inverse Design</text>

  <!-- chips -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">
    <g transform="translate(285 205)"><rect width="118" height="36" rx="18" fill="#0f766e" opacity="0.92"/><text x="59" y="23" text-anchor="middle" fill="#ecfeff">Formulation</text></g>
    <g transform="translate(414 205)"><rect width="92" height="36" rx="18" fill="#0369a1" opacity="0.92"/><text x="46" y="23" text-anchor="middle" fill="#eff6ff">Process</text></g>
    <g transform="translate(517 205)"><rect width="104" height="36" rx="18" fill="#4338ca" opacity="0.92"/><text x="52" y="23" text-anchor="middle" fill="#eef2ff">Rheology</text></g>
    <g transform="translate(632 205)"><rect width="104" height="36" rx="18" fill="#7c3aed" opacity="0.92"/><text x="52" y="23" text-anchor="middle" fill="#f5f3ff">Evidence</text></g>
    <g transform="translate(747 205)"><rect width="132" height="36" rx="18" fill="#b45309" opacity="0.92"/><text x="66" y="23" text-anchor="middle" fill="#fffbeb">Inverse Design</text></g>
  </g>

  <!-- lower mini flow -->
  <g transform="translate(285 278)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <line x1="0" y1="0" x2="558" y2="0" stroke="#94a3b8" stroke-width="2" opacity="0.55"/>
    <g fill="#e2e8f0" font-size="13">
      <circle cx="0" cy="0" r="6" fill="#22d3ee"/><text x="0" y="26" text-anchor="middle">Papers</text>
      <circle cx="112" cy="0" r="6" fill="#38bdf8"/><text x="112" y="26" text-anchor="middle">Patents</text>
      <circle cx="224" cy="0" r="6" fill="#818cf8"/><text x="224" y="26" text-anchor="middle">Standards</text>
      <circle cx="336" cy="0" r="6" fill="#a78bfa"/><text x="336" y="26" text-anchor="middle">SQLite / RAG</text>
      <circle cx="448" cy="0" r="6" fill="#f59e0b"/><text x="448" y="26" text-anchor="middle">ML</text>
      <circle cx="558" cy="0" r="6" fill="#f97316"/><text x="558" y="26" text-anchor="middle">Validation</text>
    </g>
  </g>

  <text x="1040" y="287" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#dbeafe">STRUCTURED</text>
  <text x="1040" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#dbeafe">TRACEABLE</text>
  <text x="1040" y="333" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#dbeafe">MODEL-READY</text>
</svg>