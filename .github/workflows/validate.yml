name: Validate PUR database

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate staging batches
        run: python scripts/validate_all_staging.py

      - name: Restore canonical legacy viscosity curves
        run: |
          python scripts/restore_viscosity_curves.py \
            --output data/legacy/viscosity_curves.csv.gz

      - name: Rebuild canonical Batch 005 integration release
        run: |
          python scripts/rebuild_integration_release.py \
            --output releases/pur_core_integration_v006_rebuilt.zip
          python -m zipfile -t releases/pur_core_integration_v006_rebuilt.zip

      - name: Audit recoverable Chinese relational rows
        run: python scripts/audit_cn_recovery.py

      - name: Salvage and rebuild canonical Chinese cumulative release
        run: |
          python scripts/rebuild_cn_release_salvage.py \
            --output releases/cn_seed_batch_004_rebuilt.zip
          python -m zipfile -t releases/cn_seed_batch_004_rebuilt.zip

      - name: Build cumulative v2 database
        run: python scripts/build_database_v2.py --output database/pur_master_v2.db

      - name: Build core RAG FTS index
        run: python scripts/build_rag_fts.py database/pur_master_v2.db

      - name: Extend RAG with v2 scientific relationships
        run: python scripts/build_rag_v2.py database/pur_master_v2.db

      - name: Validate cumulative v2 database
        run: python scripts/validate_database_v2.py database/pur_master_v2.db

      - name: Export ML and Agent views
        run: python scripts/export_ml_agent_v2.py --db database/pur_master_v2.db --out-dir exports/v2

      - name: Print v2 health report
        run: python scripts/database_health_report_v2.py --db database/pur_master_v2.db

      - name: Upload validated v2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pur-database-v2
          path: |
            database/pur_master_v2.db
            exports/v2/
            releases/pur_core_integration_v006_rebuilt.zip
            releases/cn_seed_batch_004_rebuilt.zip
